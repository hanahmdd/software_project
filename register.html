<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white">
  <div class="container">
    <a class="navbar-brand fw-bold">HotelX</a>

    <div>
      <a href="index.html" class="me-3"><i class="bi bi-house"></i> Home</a>
      <a href="hotels.html" class="me-3"><i class="bi bi-building"></i> Hotels</a>
      <span id="navLinks"></span>
    </div>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-box">

    <div class="card">
      <h3 class="text-center mb-4">Create Account</h3>

      <form onsubmit="registerUser(event)">

        <div class="form-group">
          <input type="text" id="name" required placeholder=" ">
          <label>Name</label>
        </div>

        <div class="form-group">
          <input type="email" id="email" required placeholder=" ">
          <label>Email</label>
        </div>

        <!-- ✅ FIXED ID -->
        <div class="form-group password-wrapper">
          <input type="password" id="password" required placeholder=" ">
          <label>Password</label>
          <i class="bi bi-eye" onclick="togglePassword('password', this)"></i>
        </div>

        <button class="btn btn-primary w-100 mt-2">
          <i class="bi bi-person-plus"></i> Register
        </button>

      </form>

      <p class="text-center mt-3">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </div>

  </div>
</div>

<footer>
  <p>© 2026 Hotel Booking</p>
</footer>

<script src="js/script.js"></script>

<script>
function togglePassword(id, icon) {
  let input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    icon.classList.replace("bi-eye", "bi-eye-slash");
  } else {
    input.type = "password";
    icon.classList.replace("bi-eye-slash", "bi-eye");
  }
}
</script>

</body>
</html>
