<!DOCTYPE html>
<html>
<head>
  <title>Booking</title>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Icons -->
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white">
  <div class="container">
    <a class="navbar-brand fw-bold">HotelX</a>

    <div>
      <a href="index.html" class="me-3"><i class="bi bi-house"></i> Home</a>
      <a href="hotels.html" class="me-3"><i class="bi bi-building"></i> Hotels</a>

      <!-- ✅ Dynamic (Login OR My Bookings + Logout) -->
      <span id="navLinks"></span>
    </div>
  </div>
</nav>

<!-- Booking Form -->
<div class="container mt-5">

  <div class="card p-4">
    <h2 class="mb-4 text-center">Book Your Stay</h2>

    <form onsubmit="bookHotel(event)">
      
      <!-- Name -->
      <label class="mb-1">Full Name</label>
      <input type="text" placeholder="Enter your name"
       class="form-control mb-3" required>

      <!-- Check-in -->
      <label class="mb-1">
        <i class="bi bi-calendar"></i> Check-in
      </label>
      <input type="date" id="checkin" class="form-control mb-3" required>

      <!-- Check-out -->
      <label class="mb-1">
        <i class="bi bi-calendar"></i> Check-out
      </label>
      <input type="date" id="checkout" class="form-control mb-3" required>

      <!-- Button -->
      <button class="btn btn-primary w-100">
        <i class="bi bi-check-circle"></i> Confirm Booking
      </button>

    </form>

  </div>

</div>

<!-- Footer -->
<footer>
  <p>© 2026 Hotel Booking</p>
</footer>

<!-- JS -->
<script src="js/script.js"></script>

</body>
</html>
