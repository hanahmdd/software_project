<!DOCTYPE html>
<html>
<head>
  <title>Hotel Details</title>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Icons -->
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white">
  <div class="container">
    <a class="navbar-brand fw-bold">HotelX</a>

    <div>
      <a href="index.html" class="me-3"><i class="bi bi-house"></i> Home</a>
      <a href="hotels.html" class="me-3"><i class="bi bi-building"></i> Hotels</a>

      <!-- ✅ Dynamic Navbar -->
      <span id="navLinks"></span>
    </div>
  </div>
</nav>

<!-- Content -->
<div class="container mt-5">

  <h2 id="hotelName"></h2>

  <p id="hotelDesc" class="text-muted"></p>

  <h4 id="hotelPrice" class="mb-3"></h4>

  <!-- ⭐ Carousel -->
  <div id="carouselExample" class="carousel slide mt-4" data-bs-ride="carousel">

    <div class="carousel-inner" id="carouselImages">
      <!-- الصور بتتحط من JS -->
    </div>

    <!-- Prev -->
    <button class="carousel-control-prev" type="button"
      data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <!-- Next -->
    <button class="carousel-control-next" type="button"
      data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>

  <!-- Book Button -->
  <div class="mt-4">
    <a href="booking.html" class="btn btn-primary">
      <i class="bi bi-calendar"></i> Book Now
    </a>
  </div>

</div>

<!-- Footer -->
<footer>
  <p>© 2026 Hotel Booking</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS -->
<script src="js/script.js"></script>

</html>
